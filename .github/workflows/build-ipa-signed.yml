name: build-ipa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore script permissions and run portable regression tests
        run: |
          chmod +x scripts/*.sh
          if [ -f tests/security_regression.py ]; then python3 tests/security_regression.py; fi

      - name: Select Xcode
        run: |
          for X in /Applications/Xcode_26*.app /Applications/Xcode_17*.app /Applications/Xcode_16.4.app /Applications/Xcode.app; do if [ -d "$X" ]; then echo "trying $X"; sudo xcode-select -s "$X/Contents/Developer" && break; fi; done
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Fetch upstream dylibs (skip QEMU rebuild)
        run: |
          set -e
          gh release download 0.6.1 --repo Leviidev/Husk --pattern "Husk.ipa" --dir /tmp
          cd /tmp && rm -rf husk-upstream && mkdir husk-upstream && cd husk-upstream
          unzip -q /tmp/Husk.ipa
          mkdir -p $GITHUB_WORKSPACE/build/ios-arm64/lib
          mkdir -p $GITHUB_WORKSPACE/build/ios-arm64/sysroot/lib
          cp Payload/Husk.app/Frameworks/libqemu-aarch64-softmmu.dylib $GITHUB_WORKSPACE/build/ios-arm64/lib/
          cp Payload/Husk.app/Frameworks/libANGLE-shared.dylib $GITHUB_WORKSPACE/build/ios-arm64/sysroot/lib/
          # ملفات الـ firmware التي يتوقعها سكربت البناء
          mkdir -p $GITHUB_WORKSPACE/third_party/build/qemu-10.0.12-utm/pc-bios
          bzip2 -c Payload/Husk.app/edk2-aarch64-code.fd > $GITHUB_WORKSPACE/third_party/build/qemu-10.0.12-utm/pc-bios/edk2-aarch64-code.fd.bz2
          ls -lh $GITHUB_WORKSPACE/build/ios-arm64/lib/ $GITHUB_WORKSPACE/third_party/build/qemu-10.0.12-utm/pc-bios/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install qemu-img
        run: brew install qemu

      - name: Fetch guest images
        run: ./scripts/fetch_phase0_guest.sh

      - name: Build MoltenVK for iOS
        run: |
          chmod +x scripts/build_moltenvk_ios.sh
          ./scripts/build_moltenvk_ios.sh

      - name: Build and package IPA (unsigned)
        run: ./scripts/package_ipa.sh /tmp/ios-app-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: /tmp/ios-app-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
