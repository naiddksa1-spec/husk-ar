name: build-ipa-signed

on:
  workflow_dispatch:

env:
  BUNDLE_ID: app.rain8097.diamond3440
  TEAM_ID: D93J85BEQB
  PROFILE_NAME: 00008140-001E28690093C01CH8XJ11
  CODE_SIGN_IDENTITY: iPhone Distribution

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Fetch upstream dylibs (skip QEMU rebuild)
        run: |
          set -e
          gh release download 0.6.1 --repo Leviidev/Husk --pattern "Husk.ipa" --dir /tmp
          cd /tmp && rm -rf husk-upstream && mkdir husk-upstream && cd husk-upstream
          unzip -q /tmp/Husk.ipa
          mkdir -p $GITHUB_WORKSPACE/build/ios-arm64/lib
          mkdir -p $GITHUB_WORKSPACE/build/ios-arm64/sysroot/lib
          cp Payload/Husk.app/Frameworks/libqemu-aarch64-softmmu.dylib $GITHUB_WORKSPACE/build/ios-arm64/lib/
          cp Payload/Husk.app/Frameworks/libANGLE-shared.dylib $GITHUB_WORKSPACE/build/ios-arm64/sysroot/lib/
          ls -lh $GITHUB_WORKSPACE/build/ios-arm64/lib/ $GITHUB_WORKSPACE/build/ios-arm64/sysroot/lib/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fetch guest images
        run: ./scripts/fetch_phase0_guest.sh

      - name: Install certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_NAME.mobileprovision"

      - name: Regenerate project
        run: |
          cd src/app && xcodegen generate

      - name: Build archive
        run: |
          xcodebuild archive \
            -project src/app/Husk.xcodeproj \
            -scheme Husk \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hask.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ env.CODE_SIGN_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_NAME }}" \
            CODE_SIGN_ENTITLEMENTS="Husk/Husk-adhoc.entitlements"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hask.xcarchive" \
            -exportOptionsPlist "src/app/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Hask-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 7
